name: Android CI & Release

on:
  push:
    branches: [ "v3_openjdk", "master", "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "v3_openjdk", "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    strategy:
      fail-fast: false
      matrix:
        flavor: [full, noruntime]
        build-type: [debug, release]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          set-safe-directory: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Get LTW Artifact
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: NDK Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_SDK_ROOT }}/ndk
          key: ${{ runner.os }}-ndk-28.2.13676358
          restore-keys: |
            ${{ runner.os }}-ndk-

      - name: Build with Gradle
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          ./gradlew :app_pojavlauncher:assemble${{ matrix.flavor }}${{ matrix.build-type }}

      - name: Prepare Artifacts
        run: |
          mkdir -p out
          find app_pojavlauncher/build/outputs/apk/ -name "*.apk" -exec cp {} out/ \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-${{ matrix.flavor }}-${{ matrix.build-type }}
          path: out/*.apk

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize Release Files
        run: |
          mkdir release_files
          find artifacts -name "*.apk" -exec cp {} release_files/ \;
          cd release_files
          for f in *.apk; do md5sum "$f" > "$f.md5"; done

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "release_files/*"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
